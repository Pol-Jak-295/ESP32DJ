<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32DJ</title>
<style>
  :root{
    --bg:#080202;
    --panel:#161010;
    --panel-2:#120909;
    --stroke:#2a2a38;
    --text:#e7ecf5;
    --muted:#7a8496;

    /* DJ palette */
    --play:#2dff6e;      /* green */
    --cue:#ff9a1f;       /* orange */
    --stem-drums:#2dff6e; /* green */
    --stem-bass:#ff9a1f;  /* orange */
    --stem-melody:#ff3d9a;/* pink */
    --stem-vocal:#3da5ff; /* blue */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 50% -10%, #14141f 0%, transparent 60%),
      radial-gradient(900px 500px at 50% 110%, #140a10 0%, transparent 60%),
      var(--bg);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 48px;
  }

  h1{
    margin:0 0 28px;
    font-size:clamp(28px,5vw,44px);
    letter-spacing:.14em;
    font-weight:800;
    background:linear-gradient(90deg,var(--play),var(--cue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .decks{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:24px;
    width:100%;
    max-width:900px;
  }
  @media (max-width:720px){
    .decks{grid-template-columns:1fr}
  }

  .deck{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--stroke);
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03);
  }

  .deck-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    font-size:13px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .deck-title .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--cue);
    box-shadow:0 0 12px var(--cue);
  }

  .row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin-bottom:10px;
  }

  /* ---- Base button: black center, color seeping from the border ---- */
  button{
    appearance:none;
    color:var(--text);
    font:inherit;
    font-size:13px;
    font-weight:600;
    padding:12px 10px;
    border-radius:10px;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    /* fallback accent, overridden per-type below */
    --c:#6b7a90;
    border:1px solid var(--c);
    background:
      radial-gradient(120% 120% at 50% 50%,
        #000 45%,
        color-mix(in srgb, var(--c) 30%, #000) 85%,
        var(--c) 100%);
    box-shadow:
      inset 0 0 12px color-mix(in srgb, var(--c) 35%, transparent),
      0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent);
    transition:transform .06s ease, box-shadow .15s ease, border-color .15s ease;
  }
button:active {
  animation: glow-out 0.5s ease forwards;
}

@keyframes glow-out {
  0% {
    box-shadow:
      inset 0 0 18px color-mix(in srgb, var(--c) 55%, transparent),
      0 0 14px color-mix(in srgb, var(--c) 45%, transparent);
  }
  70% {
    box-shadow:
      inset 0 0 18px color-mix(in srgb, var(--c) 55%, transparent),
      0 0 14px color-mix(in srgb, var(--c) 45%, transparent);
  }
  100% {
    box-shadow:
      inset 0 0 0 transparent,
      0 0 0 transparent;
  }
}


  /* ---- Color assignment (no state changes) ---- */
  button.play  { --c:var(--play); color:#c9ffda; }
  button.cue   { --c:var(--cue);  color:#ffe0b8; }
  button.cue1  { --c:var(--cue);  color:#ffe0b8; }

  .row.stems{
    grid-template-columns:repeat(4,1fr);
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--stroke);
  }
  .row.stems button.stem-drums { --c:var(--stem-drums);  color:#c9ffda; }
  .row.stems button.stem-bass  { --c:var(--stem-bass);   color:#ffe0b8; }
  .row.stems button.stem-melody{ --c:var(--stem-melody); color:#ffd0e6; }
  .row.stems button.stem-vocal { --c:var(--stem-vocal);  color:#cfe6ff; }

  footer{
    margin-top:28px;
    color:var(--muted);
    font-size:12px;
    letter-spacing:.15em;
    text-transform:uppercase;
  }
</style>
</head>
<body>

<h1>ESP32DJ</h1>

<div class="decks">
  <!-- Deck 1 -->
  <section class="deck">
    <div class="deck-title"><span>Deck 1 · Left</span><span class="dot"></span></div>

    <div class="row">
      <button class="play" onclick="fetch('/press?btn=play')">Play/Pause</button>
      <button class="cue" onclick="fetch('/press?btn=c1_1')">Cue 1</button>
      <button class="cue" onclick="fetch('/press?btn=c1_2')">Cue 2</button>
      <button class="cue" onclick="fetch('/press?btn=c1_3')">Cue 3</button>
      <button class="cue" onclick="fetch('/press?btn=c1_4')">Cue 4</button>
    </div>

    <div class="row">
      <button class="cue" onclick="fetch('/press?btn=cue')">Cue</button>
      <button class="cue" onclick="fetch('/press?btn=c1_5')">Cue 5</button>
      <button class="cue" onclick="fetch('/press?btn=c1_6')">Cue 6</button>
      <button class="cue" onclick="fetch('/press?btn=c1_7')">Cue 7</button>
      <button class="cue" onclick="fetch('/press?btn=c1_8')">Cue 8</button>
    </div>

    <div class="row stems">
      <button class="stem-drums"  onclick="fetch('/press?btn=s1_1')">Drums</button>
      <button class="stem-bass"   onclick="fetch('/press?btn=s1_2')">Bass</button>
      <button class="stem-melody" onclick="fetch('/press?btn=s1_3')">Melody</button>
      <button class="stem-vocal"  onclick="fetch('/press?btn=s1_4')">Vocal</button>
    </div>
  </section>

  <!-- Deck 2 -->
  <section class="deck right">
    <div class="deck-title"><span>Deck 2 · Right</span><span class="dot"></span></div>

    <div class="row">
      <button class="play" onclick="fetch('/press?btn=play2')">Play/Pause</button>
      <button class="cue" onclick="fetch('/press?btn=c2_1')">Cue 1</button>
      <button class="cue" onclick="fetch('/press?btn=c2_2')">Cue 2</button>
      <button class="cue" onclick="fetch('/press?btn=c2_3')">Cue 3</button>
      <button class="cue" onclick="fetch('/press?btn=c2_4')">Cue 4</button>
    </div>

    <div class="row">
      <button class="cue" onclick="fetch('/press?btn=cue2')">Cue</button>
      <button class="cue" onclick="fetch('/press?btn=c2_5')">Cue 5</button>
      <button class="cue" onclick="fetch('/press?btn=c2_6')">Cue 6</button>
      <button class="cue" onclick="fetch('/press?btn=c2_7')">Cue 7</button>
      <button class="cue" onclick="fetch('/press?btn=c2_8')">Cue 8</button>
    </div>

    <div class="row stems">
      <button class="stem-drums"  onclick="fetch('/press?btn=s2_1')">Drums</button>
      <button class="stem-bass"   onclick="fetch('/press?btn=s2_2')">Bass</button>
      <button class="stem-melody" onclick="fetch('/press?btn=s2_3')">Melody</button>
      <button class="stem-vocal"  onclick="fetch('/press?btn=s2_4')">Vocal</button>
    </div>
  </section>
</div>

<footer>Don't bother me with issues. Fix it and open a pr</footer>

</body>
</html>
